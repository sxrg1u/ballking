<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ballking</title>
  <meta name="description" content="Pixel football idle game. Pass against the wall, upgrade, and climb from street kid to the greatest of all time.">
  <meta name="theme-color" content="#0d0b16">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect x='2' y='0' width='4' height='8' fill='%23fff'/%3E%3Crect x='0' y='2' width='8' height='4' fill='%23fff'/%3E%3Crect x='1' y='1' width='6' height='6' fill='%23fff'/%3E%3Crect x='3' y='3' width='2' height='2' fill='%23111'/%3E%3Crect x='1' y='1' width='1' height='1' fill='%23111'/%3E%3Crect x='6' y='6' width='1' height='1' fill='%23111'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">BALL<span>KING</span></div>
    <div class="wallet">
      <img id="coin" class="coin" alt="" width="30" height="30">
      <div>
        <div class="tp" id="tp">0</div>
        <div class="tp-rate"><span id="tps">+0/s</span> TRAINING POINTS</div>
      </div>
    </div>
    <div class="stat-side">
      <div class="pps"><b id="pps">0</b> passes/s</div>
      <div class="muted small">Trains only while this tab is open</div>
    </div>
  </header>

  <main class="layout">
    <section class="stage">
      <div class="card" id="player-card">
        <div class="fut" id="fut">
          <div class="fut-rating" id="rating">1</div>
          <div class="fut-nation" id="fut-nation">IND</div>
          <canvas class="fut-face" id="portrait" width="52" height="52"></canvas>
          <div class="fut-kit" id="fut-kit"></div>
        </div>
        <div class="card-info">
          <div class="player-name" id="player-name">Ravi</div>
          <div class="player-meta" id="player-meta">IND</div>
          <div class="xpbar"><div class="xpbar-fill" id="xp-bar"></div><span class="xpbar-text" id="xp-text"></span></div>
          <div class="next" id="next-player"></div>
        </div>
      </div>

      <div class="scene-wrap">
        <canvas id="scene" width="192" height="108" aria-label="Training scene"></canvas>
        <div class="scene-hud">
          <div class="hud-chip streak-chip" id="streak-chip"><img id="fire" alt="" width="20" height="20"><span id="streak">0</span><b id="streak-mult">x1.00</b></div>
          <div class="hud-chip ground-chip" id="ground-name">Ruined Lot</div>
        </div>
        <div class="scene-overlay" id="overlay"></div>
        <div class="banner hidden" id="banner"></div>
      </div>

      <div class="scene-info">
        <div class="chip"><span class="k">BALLS</span><span id="balls">1</span></div>
        <div class="chip"><span class="k">SUCCESS</span><span id="success">60%</span></div>
        <div class="chip"><span class="k">TP / PASS</span><span id="tpp">1</span></div>
      </div>
    </section>

    <aside class="panel">
      <nav class="tabs" id="tabs">
        <button data-view="upgrades" class="active"><img data-icon="upgrades" alt=""><span>Upgrades</span></button>
        <button data-view="career"><img data-icon="career" alt=""><span>Career</span></button>
        <button data-view="stats"><img data-icon="stats" alt=""><span>Stats</span></button>
        <button data-view="settings"><img data-icon="settings" alt=""><span>Settings</span></button>
      </nav>
      <div class="view" id="view"></div>
    </aside>
  </main>

  <div id="toasts" class="toasts"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
